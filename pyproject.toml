[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "networkids"
version = "0.1.0"
description = "Evidence-based offline network intrusion detection toolkit"
requires-python = ">=3.11"
dependencies = ["scapy>=2.5.0,<3.0.0"]

[project.scripts]
networkids = "networkids.cli:main"

[tool.setuptools.packages.find]
include = ["networkids*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
